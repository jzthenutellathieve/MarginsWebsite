<section data-mj-page="reporting" class="md-collection" aria-labelledby="collection-title" data-mj-collection data-topic="{{topic}}">
  <div class="md-collection-heading"><div><p class="md-kicker">The collection</p><h1 id="collection-title">{{heading}}</h1></div><p>Essays, reporting and research notes on displacement, land and water.</p></div>
  <div class="md-collection-tools">
    <nav class="md-topics" aria-label="Article topics">{{topics}}</nav>
    <form class="md-article-search" action="{{basePath}}" method="get" role="search" data-mj-search hidden>
      <label class="md-sr-only" for="article-search">Search articles</label><input id="article-search" name="q" type="search" placeholder="Search the journal…" autocomplete="off"><button type="submit" aria-label="Search articles">Search <span aria-hidden="true">→</span></button>
    </form>
  </div>
  <p class="md-results-summary" data-mj-results-summary role="status">{{summary}}</p>
  <div class="md-article-list" data-mj-results>{{articles}}</div>
  <div data-mj-pagination>{{pagination}}</div>
</section>
